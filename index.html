<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Age of War - HD Ultimate Edition</title>
    <style>
        body {
            background-color: #050505;
            color: #f5f5f5;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 5px;
            user-select: none;
        }
        
        /* HD Ahşap Lüks Üst Panel (HUD) */
        .game-header {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: linear-gradient(to bottom, #5c3a21, #3b2311);
            border: 4px solid #1a0f07;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 5px 15px rgba(0,0,0,0.8);
        }
        .hud-stats {
            background: linear-gradient(to bottom, #d4a373, #bc8a5f);
            border: 2px solid #28180b;
            color: #111;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 13px;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.4);
        }
        .hud-menu {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hud-btn {
            background: linear-gradient(to bottom, #fefae0, #ccd5ae);
            border: 2px solid #28180b;
            padding: 6px 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #111;
            border-radius: 4px;
            transition: 0.1s;
            box-shadow: 0 3px 0 #5c3a21;
        }
        .hud-btn:hover { background: #fff; transform: translateY(-1px); }
        .hud-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5c3a21; }

        /* HD Oyun Tuvali ve Gölgelendirme */
        canvas {
            background: linear-gradient(to bottom, #1e3c72 0%, #2a5298 50%, #432818 50%, #1a0f07 100%);
            border-left: 4px solid #1a0f07;
            border-right: 4px solid #1a0f07;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        /* HD Alt Kontrol Paneli */
        .game-footer {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: linear-gradient(to bottom, #5c3a21, #3b2311);
            border: 4px solid #1a0f07;
            border-top: none;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        .footer-btn {
            background: linear-gradient(to bottom, #d90429, #9b111e);
            color: white;
            border: 2px solid #1a0f07;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 3px 0 #4a0000;
            transition: 0.1s;
        }
        .footer-btn:hover { filter: brightness(1.2); }
        .footer-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4a0000; }
    </style>
</head>
<body>

    <!-- Üst HUD -->
    <div class="game-header">
        <div class="hud-stats">
            Gold: <span id="gold" style="color: #b8860b;">200</span><br>
            Exp: <span id="exp" style="color: #004d40;">0</span><br>
            Çağ: <span id="ageText" style="color: #8b0000;">1 - Mağara Çağı</span>
        </div>
        <div class="hud-menu" id="unitMenu"></div>
    </div>

    <!-- Oyun Alanı -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Alt Kontrol Paneli -->
    <div class="game-footer">
        <button class="footer-btn" onclick="specialAttack()">Özel Bomba (70G)</button>
        <button class="footer-btn" onclick="repairBase()" style="background: linear-gradient(to bottom, #2b9348, #134e13); box-shadow: 0 3px 0 #0a260a;">Üssü Onar (50G)</button>
        <button class="footer-btn" onclick="upgradeAge()" style="background: linear-gradient(to bottom, #ffb703, #fb8500); color:#111; box-shadow: 0 3px 0 #9d4edd;">ÇAĞ ATLA</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- WEB AUDIO API (Harici ses dosyası gerektirmeyen sentetik ses motoru) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            let now = audioCtx.currentTime;
            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        let gold = 250;
        let exp = 0;
        let currentAge = 1;
        let playerBaseHp = 500;
        let enemyBaseHp = 500;

        let units = [];
        let particles = [];
        let enemySpawnTimer = 0;

        // 4 Çağlık HD Veritabanı ve Karakter Tasarımları
        const agesData = {
            1: {
                name: "1 - Mağara Çağı",
                xpReq: 180,
                units: [
                    { name: "Sopalı", cost: 15, hp: 50, attack: 0.6, range: 25, speed: 1.2, color: "#d4a373" },
                    { name: "Sapanlı", cost: 35, hp: 35, attack: 0.8, range: 120, speed: 1.0, color: "#606c38" }
                ],
                enemies: [
                    { hp: 50, attack: 0.6, speed: -1.2, color: "#bc6c25", range: 25 },
                    { hp: 35, attack: 0.8, speed: -1.0, color: "#858157", range: 120 }
                ]
            },
            2: {
                name: "2 - Tunç Çağı",
                xpReq: 400,
                units: [
                    { name: "Kılıçlı", cost: 50, hp: 100, attack: 1.4, range: 28, speed: 1.1, color: "#adb5bd" },
                    { name: "Okçu", cost: 80, hp: 65, attack: 1.8, range: 135, speed: 0.9, color: "#3a86ff" }
                ],
                enemies: [
                    { hp: 100, attack: 1.4, speed: -1.1, color: "#6c757d", range: 28 },
                    { hp: 65, attack: 1.8, speed: -0.9, color: "#0077b6", range: 135 }
                ]
            },
            3: {
                name: "3 - Demir Çağı",
                xpReq: 800,
                units: [
                    { name: "Şövalye", cost: 130, hp: 190, attack: 2.8, range: 30, speed: 1.0, color: "#e9c46a" },
                    { name: "Arbaletçi", cost: 190, hp: 120, attack: 3.5, range: 145, speed: 0.8, color: "#f4a261" }
                ],
                enemies: [
                    { hp: 190, attack: 2.8, speed: -1.0, color: "#d4a373", range: 30 },
                    { hp: 120, attack: 3.5, speed: -0.8, color: "#e76f51", range: 145 }
                ]
            },
            4: {
                name: "4 - Gelecek Çağı",
                xpReq: 99999,
                units: [
                    { name: "Lazer Bot", cost: 320, hp: 380, attack: 5.5, range: 35, speed: 1.3, color: "#00f5d4" },
                    { name: "Plazma", cost: 480, hp: 240, attack: 7.5, range: 165, speed: 0.9, color: "#7209b7" }
                ],
                enemies: [
                    { hp: 380, attack: 5.5, speed: -1.3, color: "#4cc9f0", range: 35 },
                    { hp: 240, attack: 7.5, speed: -0.9, color: "#3f37c9", range: 165 }
                ]
            }
        };

        function updateUI() {
            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("exp").innerText = exp;
            document.getElementById("ageText").innerText = agesData[currentAge].name;
            
            let html = "";
            let curUnits = agesData[currentAge].units;
            for (let i = 0; i < curUnits.length; i++) {
                html += `<button class="hud-btn" onclick="spawnUnit(${i})">${curUnits[i].name}<br>(${curUnits[i].cost}G)</button>`;
            }
            document.getElementById("unitMenu").innerHTML = html;
        }

        function spawnUnit(index) {
            let uData = agesData[currentAge].units[index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                playSound('coin');
                updateUI();

                units.push({
                    x: 95,
                    y: 340,
                    speed: uData.speed,
                    team: 'player',
                    hp: uData.hp,
                    maxHp: uData.hp,
                    attack: uData.attack,
                    range: uData.range,
                    color: uData.color
                });
            }
        }

        function upgradeAge() {
            let req = agesData[currentAge].xpReq;
            if (exp >= req && currentAge < 4) {
                currentAge++;
                exp = 0;
                playSound('coin');
                alert(`Tebrikler! ${agesData[currentAge].name} na yükseldin!`);
                updateUI();
            } else if (currentAge >= 4) {
                alert("Zaten son çağdasın usta, zirvedesin!");
            } else {
                alert(`Çağ atlamak için ${req} XP gerekiyor! (Mevcut: ${exp})`);
            }
        }

        function specialAttack() {
            if (gold >= 70) {
                gold -= 70;
                playSound('boom');
                updateUI();
                for (let u of units) {
                    if (u.team === 'enemy') u.hp -= 100;
                }
                enemyBaseHp -= 40;
                for (let i = 0; i < 50; i++) {
                    particles.push({
                        x: Math.random() * 600 + 100,
                        y: Math.random() * 300 + 50,
                        vx: (Math.random() - 0.5) * 12,
                        vy: (Math.random() - 0.5) * 12,
                        life: 35,
                        color: Math.random() > 0.5 ? "#ff0054" : "#ffb703"
                    });
                }
            }
        }

        function repairBase() {
            if (gold >= 50 && playerBaseHp < 500) {
                gold -= 50;
                playerBaseHp = Math.min(500, playerBaseHp + 80);
                playSound('coin');
                updateUI();
            }
        }

        setInterval(() => {
            gold += 4;
            updateUI();
        }, 1000);

        updateUI();

        // Ana HD Oyun Döngüsü
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- HD ÜSLER VE ÇEVRE ---
            // Oyuncu Üssü (Sol)
            ctx.fillStyle = currentAge === 4 ? "#00796b" : "#3e2723";
            ctx.beginPath();
            ctx.arc(60, 310, 55, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.ellipse(60, 340, 22, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Düşman Üssü (Sağ)
            ctx.fillStyle = currentAge === 4 ? "#512da8" : "#3e2723";
            ctx.beginPath();
            ctx.arc(740, 310, 55, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.ellipse(740, 340, 22, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- HD DİKEY CAN BARLARI (GLOW EFEKTİ) ---
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(255, 0, 0, 0.5)";
            
            ctx.fillStyle = "#111";
            ctx.fillRect(18, 130, 14, 210);
            ctx.fillStyle = "#ff1744";
            let pBarH = (playerBaseHp / 500) * 210;
            ctx.fillRect(18, 130 + (210 - pBarH), 14, pBarH);

            ctx.fillStyle = "#111";
            ctx.fillRect(768, 130, 14, 210);
            ctx.fillStyle = "#ff1744";
            let eBarH = (enemyBaseHp / 500) * 210;
            ctx.fillRect(768, 130 + (210 - eBarH), 14, eBarH);
            
            ctx.shadowBlur = 0; // Gölgelendirmeyi sıfırla

            // --- DÜŞMAN YAPAY ZEKA ÜRETİMİ ---
            enemySpawnTimer++;
            if (enemySpawnTimer > 110 && enemyBaseHp > 0) {
                enemySpawnTimer = 0;
                let ePool = agesData[currentAge].enemies;
                let t = ePool[Math.floor(Math.random() * ePool.length)];
                
                units.push({
                    x: 705,
                    y: 340,
                    speed: t.speed,
                    team: 'enemy',
                    hp: t.hp,
                    maxHp: t.hp,
                    attack: t.attack,
                    range: t.range,
                    color: t.color
                });
            }

            // --- BİRİM HAREKET, ÇARPIŞMA VE SESLER ---
            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (Math.random() < 0.2) playSound('hit');
                            if (target.hp <= 0) {
                                exp += 30;
                                playSound('coin');
                            }
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (Math.random() < 0.2) playSound('hit');
                        }
                    }
                }

                // Üslere Hasar
                if (u.team === 'player' && u.x >= 710) {
                    enemyBaseHp -= 0.7;
                    combat = true;
                } else if (u.team === 'enemy' && u.x <= 90) {
                    playerBaseHp -= 0.7;
                    combat = true;
                }

                if (!combat) {
                    u.x += u.speed;
                }

                // HD Karakter Çizimi (Gövde + Baş + Zırh Parıltısı)
                ctx.fillStyle = u.color;
                ctx.fillRect(u.x - 6, u.y - 28, 12, 28);
                ctx.fillStyle = "#fffaed";
                ctx.beginPath();
                ctx.arc(u.x, u.y - 33, 5, 0, Math.PI * 2);
                ctx.fill();

                // HD Can Barı
                ctx.fillStyle = "#000";
                ctx.fillRect(u.x - 11, u.y - 43, 22, 4);
                ctx.fillStyle = "#06d6a0";
                ctx.fillRect(u.x - 11, u.y - 43, (u.hp / u.maxHp) * 22, 4);
            }

            units = units.filter(u => u.hp > 0);

            // Parçacık Efektleri
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 5, 5);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Oyun Bitiş Kontrolleri
            if (playerBaseHp <= 0) {
                alert("Üssün yıkıldı! Maalesef kaybettin.");
                location.reload();
            } else if (enemyBaseHp <= 0) {
                alert("Tebrikler! Bütün çağları geçtin ve düşmanı yok ettin!");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
