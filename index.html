<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Age of War - Ultimate Edition</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 5px;
        }
        
        /* Ahşap Üst Panel (HUD) */
        .game-header {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: #7a4f2b;
            border: 4px solid #3b2311;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }
        .hud-stats {
            background: #c29b68;
            border: 2px solid #3b2311;
            color: #111;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 12px;
            text-align: left;
            line-height: 1.3;
        }
        .hud-menu {
            display: flex;
            gap: 4px;
            background: #966f47;
            padding: 4px;
            border: 2px solid #3b2311;
        }
        .hud-btn {
            background: #f4f1de;
            border: 2px solid #3b2311;
            padding: 4px 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #222;
        }
        .hud-btn:hover { background: #e0dfd5; }
        .hud-btn:active { background: #bcb8ad; }

        /* Oyun Tuvali */
        canvas {
            background: linear-gradient(to bottom, #3a7bd5 0%, #3a6073 60%, #4e3629 60%, #22150e 100%);
            border-left: 4px solid #3b2311;
            border-right: 4px solid #3b2311;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        /* Alt Kontrol Paneli */
        .game-footer {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: #7a4f2b;
            border: 4px solid #3b2311;
            border-top: none;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        .footer-btn {
            background: #bc4749;
            color: white;
            border: 2px solid #281808;
            padding: 8px 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
        }
        .footer-btn:hover { background: #d9534f; }
    </style>
</head>
<body>

    <!-- Üst HUD -->
    <div class="game-header">
        <div class="hud-stats">
            Gold: <span id="gold">200</span><br>
            Exp: <span id="exp">0</span><br>
            Çağ: <span id="ageText">1 - Mağara</span>
        </div>
        <div class="hud-menu" id="unitMenu">
            <!-- Dinamik Asker Butonları Buraya Gelecek -->
        </div>
    </div>

    <!-- Oyun Alanı -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Alt Panel -->
    <div class="game-footer">
        <button class="footer-btn" onclick="specialAttack()">Özel Bomba (60G)</button>
        <button class="footer-btn" onclick="repairBase()" style="background: #38b000;">Kareyi Onar (50G)</button>
        <button class="footer-btn" onclick="upgradeAge()" style="background: #ffb703; color:#111;">ÇAĞ ATLA (Yükselt)</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gold = 200;
        let exp = 0;
        let currentAge = 1; // 1: Mağara, 2: Tunç, 3: Demir, 4: Gelecek
        let playerBaseHp = 500;
        let enemyBaseHp = 500;

        let units = [];
        let particles = [];
        let enemySpawnTimer = 0;

        // Çağlara Göre Birim Veritabanı
        const agesData = {
            1: {
                name: "1 - Mağara Çağı",
                xpRequired: 150,
                units: [
                    { name: "Sopalı", cost: 15, hp: 45, attack: 0.5, range: 25, speed: 1.2, color: "#d4a373" },
                    { name: "Sapanlı", cost: 30, hp: 30, attack: 0.7, range: 110, speed: 1.0, color: "#588157" }
                ],
                enemyUnits: [
                    { hp: 45, attack: 0.5, speed: -1.2, color: "#9a3412", range: 25 },
                    { hp: 30, attack: 0.7, speed: -1.0, color: "#7f4f24", range: 110 }
                ]
            },
            2: {
                name: "2 - Tunç Çağı",
                xpRequired: 350,
                units: [
                    { name: "Kılıçlı", cost: 45, hp: 90, attack: 1.2, range: 28, speed: 1.1, color: "#adb5bd" },
                    { name: "Okçu", cost: 70, hp: 60, attack: 1.5, range: 130, speed: 0.9, color: "#3a86ff" }
                ],
                enemyUnits: [
                    { hp: 90, attack: 1.2, speed: -1.1, color: "#6c757d", range: 28 },
                    { hp: 60, attack: 1.5, speed: -0.9, color: "#0077b6", range: 130 }
                ]
            },
            3: {
                name: "3 - Demir Çağı",
                xpRequired: 700,
                units: [
                    { name: "Şövalye", cost: 120, hp: 180, attack: 2.5, range: 30, speed: 1.0, color: "#e9c46a" },
                    { name: "Arbaletçi", cost: 180, hp: 110, attack: 3.0, range: 140, speed: 0.8, color: "#f4a261" }
                ],
                enemyUnits: [
                    { hp: 180, attack: 2.5, speed: -1.0, color: "#d4a373", range: 30 },
                    { hp: 110, attack: 3.0, speed: -0.8, color: "#e76f51", range: 140 }
                ]
            },
            4: {
                name: "4 - Gelecek Çağı",
                xpRequired: 99999,
                units: [
                    { name: "Lazer Asker", cost: 300, hp: 350, attack: 5.0, range: 35, speed: 1.2, color: "#00f5d4" },
                    { name: "Plazma Topçu", cost: 450, hp: 220, attack: 7.0, range: 160, speed: 0.9, color: "#7209b7" }
                ],
                enemyUnits: [
                    { hp: 350, attack: 5.0, speed: -1.2, color: "#4cc9f0", range: 35 },
                    { hp: 220, attack: 7.0, speed: -0.9, color: "#3f37c9", range: 160 }
                ]
            }
        };

        function updateUI() {
            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("exp").innerText = exp;
            document.getElementById("ageText").innerText = agesData[currentAge].name;
            
            // Asker Menüsünü Güncelle
            let menuHtml = "";
            let currentUnits = agesData[currentAge].units;
            for (let i = 0; i < currentUnits.length; i++) {
                menuHtml += `<button class="hud-btn" onclick="spawnUnit(${i})">${currentUnits[i].name}<br>(${currentUnits[i].cost}G)</button>`;
            }
            document.getElementById("unitMenu").innerHTML = menuHtml;
        }

        function spawnUnit(index) {
            let uData = agesData[currentAge].units[index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                updateUI();

                units.push({
                    x: 95,
                    y: 335,
                    speed: uData.speed,
                    team: 'player',
                    hp: uData.hp,
                    maxHp: uData.hp,
                    attack: uData.attack,
                    range: uData.range,
                    color: uData.color
                });
            }
        }

        function upgradeAge() {
            let req = agesData[currentAge].xpRequired;
            if (exp >= req && currentAge < 4) {
                currentAge++;
                exp = 0;
                alert(`Tebrikler! ${agesData[currentAge].name} na yükseldin!`);
                updateUI();
            } else if (currentAge >= 4) {
                alert("Zaten son çağdasın usta, zirvedesin!");
            } else {
                alert(`Çağ atlamak için ${req} XP gerekiyor! (Mevcut: ${exp})`);
            }
        }

        function specialAttack() {
            if (gold >= 60) {
                gold -= 60;
                updateUI();
                for (let u of units) {
                    if (u.team === 'enemy') u.hp -= 90;
                }
                enemyBaseHp -= 35;
                for (let i = 0; i < 40; i++) {
                    particles.push({
                        x: Math.random() * 500 + 150,
                        y: Math.random() * 250 + 100,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 30,
                        color: "#ff0054"
                    });
                }
            }
        }

        function repairBase() {
            if (gold >= 50 && playerBaseHp < 500) {
                gold -= 50;
                playerBaseHp = Math.min(500, playerBaseHp + 75);
                updateUI();
            }
        }

        // Pasif Altın Akışı
        setInterval(() => {
            gold += 4;
            updateUI();
        }, 1000);

        updateUI();

        // Ana Oyun Döngüsü
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- ÜSLER VE ÇEVRE ---
            // Oyuncu Üssü (Sol)
            ctx.fillStyle = currentAge === 4 ? "#009688" : "#2c1d11";
            ctx.beginPath();
            ctx.arc(60, 310, 55, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#050302";
            ctx.beginPath();
            ctx.ellipse(60, 335, 22, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // Düşman Üssü (Sağ)
            ctx.fillStyle = currentAge === 4 ? "#673ab7" : "#2c1d11";
            ctx.beginPath();
            ctx.arc(740, 310, 55, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#050302";
            ctx.beginPath();
            ctx.ellipse(740, 335, 22, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- DİKEY CAN BARLARI ---
            ctx.fillStyle = "#111";
            ctx.fillRect(18, 140, 12, 195);
            ctx.fillStyle = "#d90429";
            let pBarH = (playerBaseHp / 500) * 195;
            ctx.fillRect(18, 140 + (195 - pBarH), 12, pBarH);

            ctx.fillStyle = "#111";
            ctx.fillRect(770, 140, 12, 195);
            ctx.fillStyle = "#d90429";
            let eBarH = (enemyBaseHp / 500) * 195;
            ctx.fillRect(770, 140 + (195 - eBarH), 12, eBarH);

            // --- DÜŞMAN ÜRETİM YAPAY ZEKASI ---
            enemySpawnTimer++;
            if (enemySpawnTimer > 120 && enemyBaseHp > 0) {
                enemySpawnTimer = 0;
                let ePool = agesData[currentAge].enemyUnits;
                let randomTemplate = ePool[Math.floor(Math.random() * ePool.length)];
                
                units.push({
                    x: 705,
                    y: 335,
                    speed: randomTemplate.speed,
                    team: 'enemy',
                    hp: randomTemplate.hp,
                    maxHp: randomTemplate.hp,
                    attack: randomTemplate.attack,
                    range: randomTemplate.range,
                    color: randomTemplate.color
                });
            }

            // --- BİRİM HAREKET VE ÇARPIŞMA ---
            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (target.hp <= 0) exp += 25; // Düşman ölünce XP
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                        }
                    }
                }

                // Üslere Hasar
                if (u.team === 'player' && u.x >= 710) {
                    enemyBaseHp -= 0.6;
                    combat = true;
                } else if (u.team === 'enemy' && u.x <= 90) {
                    playerBaseHp -= 0.6;
                    combat = true;
                }

                if (!combat) {
                    u.x += u.speed;
                }

                // Karakter Çizimi
                ctx.fillStyle = u.color;
                ctx.fillRect(u.x - 5, u.y - 24, 10, 24);
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(u.x, u.y - 28, 4, 0, Math.PI * 2);
                ctx.fill();

                // Can Barı
                ctx.fillStyle = "#000";
                ctx.fillRect(u.x - 9, u.y - 38, 18, 3);
                ctx.fillStyle = "#38b000";
                ctx.fillRect(u.x - 9, u.y - 38, (u.hp / u.maxHp) * 18, 3);
            }

            units = units.filter(u => u.hp > 0);

            // Patlama Efektleri
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Oyun Bitiş Kontrolleri
            if (playerBaseHp <= 0) {
                alert("Üssün yıkıldı! Maalesef kaybettin.");
                location.reload();
            } else if (enemyBaseHp <= 0) {
                alert("Tebrikler! Bütün çağları geçtin ve düşmanı yok ettin!");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
