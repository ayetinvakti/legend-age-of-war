<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Age of War</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5px;
        }
        h2 { margin: 5px 0; color: #ffb300; font-size: 18px; }
        
        /* Üst Ahşap Panel Alanı (Orijinal Oyuna Benzer) */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #8b5a2b;
            border: 4px solid #5c3a21;
            max-width: 800px;
            margin: 0 auto;
            padding: 5px 10px;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .stats-box {
            background: #d4a373;
            color: #222;
            padding: 5px 10px;
            font-weight: bold;
            border: 2px solid #5c3a21;
            font-size: 14px;
            text-align: left;
        }
        .menu-buttons {
            display: flex;
            gap: 5px;
        }
        .menu-btn {
            background: #e9edc9;
            border: 2px solid #5c3a21;
            padding: 5px 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            color: #333;
        }
        .menu-btn:hover { background: #ccd5ae; }
        .menu-btn:active { background: #fefae0; }

        /* Oyun Tuvali (Gökyüzü ve Zemin) */
        canvas {
            background: linear-gradient(to bottom, #4a90e2 0%, #7ab1f7 65%, #4e3629 65%, #2d1f18 100%);
            border: 4px solid #5c3a21;
            display: block;
            margin: 5px auto;
            max-width: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* Alt Kontrol Paneli */
        .control-panel {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #2b2b2b;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .action-btn {
            background: #d90429;
            color: white;
            border: 2px solid #ef233c;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }
        .action-btn:hover { background: #ef233c; }
        .upgrade-btn {
            background: #2b9348;
            color: white;
            border: 2px solid #55a630;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }
        .upgrade-btn:hover { background: #55a630; }
    </style>
</head>
<body>

    <h2>Legend Age of War</h2>

    <!-- Üst Kaynak ve Menü Paneli -->
    <div class="top-hud">
        <div class="stats-box">
            Gold: <span id="gold">150</span><br>
            Exp: <span id="exp">0</span>
        </div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="spawnUnit(0)">Asker 1 (15G)</button>
            <button class="menu-btn" onclick="spawnUnit(1)">Asker 2 (30G)</button>
            <button class="menu-btn" onclick="upgradeAge()" style="background: #ffb703;">Çağ Atla (200XP)</button>
        </div>
    </div>

    <!-- Oyun Alanı -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Alt Ekstra Kontroller -->
    <div class="control-panel">
        <button class="action-btn" onclick="specialAttack()">Özel Bomba (50G)</button>
        <button class="upgrade-btn" onclick="repairBase()">Kareyi Onar (40G)</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gold = 150;
        let exp = 0;
        let currentAge = 1;
        let playerBaseHp = 500;
        let enemyBaseHp = 500;

        let units = [];
        let particles = [];
        let enemySpawnTimer = 0;

        // Birim Özellikleri
        const unitsConfig = {
            1: [
                { name: "Sopalı", cost: 15, hp: 50, attack: 0.5, range: 25, speed: 1.2, color: "#e0a96d" },
                { name: "Sapanlı", cost: 30, hp: 35, attack: 0.7, range: 110, speed: 1.0, color: "#606c38" }
            ]
        };

        function updateUI() {
            document.getElementById("gold").innerText = gold;
            document.getElementById("exp").innerText = exp;
        }

        // Oyuncu Asker Üretme
        function spawnUnit(index) {
            let uData = unitsConfig[currentAge][index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                updateUI();

                units.push({
                    x: 90,
                    y: 335,
                    speed: uData.speed,
                    team: 'player',
                    hp: uData.hp,
                    maxHp: uData.hp,
                    attack: uData.attack,
                    range: uData.range,
                    color: uData.color
                });
            }
        }

        // Özel Bomba Yeteneği
        function specialAttack() {
            if (gold >= 50) {
                gold -= 50;
                updateUI();
                for (let u of units) {
                    if (u.team === 'enemy') {
                        u.hp -= 60;
                    }
                }
                enemyBaseHp -= 20;
                // Patlama efekt parçacıkları
                for (let i = 0; i < 30; i++) {
                    particles.push({
                        x: Math.random() * 500 + 150,
                        y: Math.random() * 250 + 100,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 25,
                        color: "#fb8500"
                    });
                }
            }
        }

        // Üs Onarma
        function repairBase() {
            if (gold >= 40 && playerBaseHp < 500) {
                gold -= 40;
                playerBaseHp = Math.min(500, playerBaseHp + 50);
                updateUI();
            }
        }

        // Çağ Atlama
        function upgradeAge() {
            if (exp >= 200 && currentAge === 1) {
                currentAge = 2;
                exp -= 200;
                alert("Tebrikler! 2. Çağa geçtiniz!");
                updateUI();
            } else if (currentAge < 2) {
                alert("Yeterli XP yok! (Gereken: 200 XP)");
            }
        }

        // Zamanla Altın Artışı
        setInterval(() => {
            gold += 3;
            updateUI();
        }, 1000);

        // Ana Oyun Döngüsü
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- 1. MAĞARALAR VE ÜSLER ---
            // Oyuncu Mağarası (Sol)
            ctx.fillStyle = "#3d2817";
            ctx.beginPath();
            ctx.arc(60, 310, 50, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.ellipse(60, 335, 20, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Düşman Mağarası (Sağ)
            ctx.fillStyle = "#3d2817";
            ctx.beginPath();
            ctx.arc(740, 310, 50, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.ellipse(740, 335, 20, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- 2. DİKEY KIRMIZI CAN BARLARI (Üs Canları) ---
            // Oyuncu Can Barı (Sol)
            ctx.fillStyle = "#222";
            ctx.fillRect(20, 150, 10, 180);
            ctx.fillStyle = "red";
            let pBarHeight = (playerBaseHp / 500) * 180;
            ctx.fillRect(20, 150 + (180 - pBarHeight), 10, pBarHeight);

            // Düşman Can Barı (Sağ)
            ctx.fillStyle = "#222";
            ctx.fillRect(770, 150, 10, 180);
            ctx.fillStyle = "red";
            let eBarHeight = (enemyBaseHp / 500) * 180;
            ctx.fillRect(770, 150 + (180 - eBarHeight), 10, eBarHeight);

            // --- 3. DÜŞMAN YAPAY ZEKA ÜRETİMİ ---
            enemySpawnTimer++;
            if (enemySpawnTimer > 150 && enemyBaseHp > 0) {
                enemySpawnTimer = 0;
                units.push({
                    x: 710,
                    y: 335,
                    speed: -1.2,
                    team: 'enemy',
                    hp: 50,
                    maxHp: 50,
                    attack: 0.5,
                    range: 25,
                    color: "#bc6c25"
                });
            }

            // --- 4. BİRİM HAREKET VE ÇARPIŞMA ---
            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (target.hp <= 0) exp += 15;
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                        }
                    }
                }

                // Üslere Hasar Verme
                if (u.team === 'player' && u.x >= 710) {
                    enemyBaseHp -= 0.5;
                    combat = true;
                } else if (u.team === 'enemy' && u.x <= 90) {
                    playerBaseHp -= 0.5;
                    combat = true;
                }

                if (!combat) {
                    u.x += u.speed;
                }

                // Birimi Çiz (Karakter Temsili)
                ctx.fillStyle = u.color;
                ctx.fillRect(u.x - 6, u.y - 25, 12, 25);
                ctx.fillStyle = "#ffb703"; // Baş kısmı
                ctx.beginPath();
                ctx.arc(u.x, u.y - 30, 5, 0, Math.PI * 2);
                ctx.fill();

                // Mini Can Barı
                ctx.fillStyle = "black";
                ctx.fillRect(u.x - 10, u.y - 42, 20, 3);
                ctx.fillStyle = "lime";
                ctx.fillRect(u.x - 10, u.y - 42, (u.hp / u.maxHp) * 20, 3);
            }

            // Ölenleri Temizle
            units = units.filter(u => u.hp > 0);

            // --- 5. EFEKTLER (PARTİKLER) ---
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 5, 5);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Oyun Bitiş Kontrolü
            if (playerBaseHp <= 0) {
                alert("Maalesef kaybettiniz! Üssünüz yıkıldı.");
                location.reload();
            } else if (enemyBaseHp <= 0) {
                alert("Tebrikler! Düşman üssünü yok ettiniz ve kazandınız!");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
