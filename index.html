<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Legend Age of War - Ultimate HD Remastered</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background-color: #020202;
            color: #ffffff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 5px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Ultra HD Lüks Ahşap Panel (HUD) */
        .game-header {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: linear-gradient(135deg, #4a2e12, #271708);
            border: 4px solid #140b04;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.25), 0 8px 25px rgba(0,0,0,0.9);
        }
        .hud-stats {
            background: linear-gradient(to bottom, #d4a373, #99683b);
            border: 2px solid #140b04;
            color: #111;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 12px;
            text-align: left;
            line-height: 1.4;
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.5);
        }
        .hud-menu {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hud-btn {
            background: linear-gradient(to bottom, #fefae0, #b5bc90);
            border: 2px solid #140b04;
            padding: 6px 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #111;
            border-radius: 5px;
            transition: 0.1s;
            box-shadow: 0 4px 0 #3a220e;
        }
        .hud-btn:hover { background: #ffffff; transform: translateY(-1px); }
        .hud-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a220e; }

        /* Ultra HD Canvas Alanı */
        canvas {
            background: linear-gradient(to bottom, #0f2027 0%, #203a43 50%, #2c5364 50%, #1a1008 100%);
            border-left: 4px solid #140b04;
            border-right: 4px solid #140b04;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        }

        /* Ultra HD Alt Kontrol Paneli */
        .game-footer {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: linear-gradient(135deg, #4a2e12, #271708);
            border: 4px solid #140b04;
            border-top: none;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .footer-btn {
            background: linear-gradient(to bottom, #d90429, #7a0215);
            color: white;
            border: 2px solid #140b04;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 0 #3a0007;
            transition: 0.1s;
        }
        .footer-btn:hover { filter: brightness(1.25); }
        .footer-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a0007; }
    </style>
</head>
<body>

    <!-- Üst HUD -->
    <div class="game-header">
        <div class="hud-stats">
            Gold: <span id="gold" style="color: #ffd700;">350</span><br>
            Exp: <span id="exp" style="color: #00ffcc;">0</span><br>
            Seviye / Çağ: <span id="ageText" style="color: #ff4d4d;">1 (Mağara Başlangıcı)</span>
        </div>
        <div class="hud-menu" id="unitMenu"></div>
    </div>

    <!-- Oyun Alanı -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Alt Kontrol Paneli -->
    <div class="game-footer">
        <button class="footer-btn" onclick="specialAttack()">Atomik Bomba (70G)</button>
        <button class="footer-btn" onclick="repairBase()" style="background: linear-gradient(to bottom, #38b000, #134e13); box-shadow: 0 4px 0 #072605;">Üssü Güçlendir (50G)</button>
        <button class="footer-btn" onclick="upgradeAge()" style="background: linear-gradient(to bottom, #ffb703, #fb8500); color:#111; box-shadow: 0 4px 0 #7b3800;">SÜPER ÇAĞ ATLA</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- SES MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let t = audioCtx.currentTime;

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(1600, t + 0.12);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
                osc.start(t); osc.stop(t + 0.12);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.linearRampToValueAtTime(50, t + 0.08);
                gain.gain.setValueAtTime(0.25, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                osc.start(t); osc.stop(t + 0.08);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 0.5);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            }
        }

        let gold = 350;
        let exp = 0;
        let currentAge = 1;
        let playerBaseHp = 600;
        let enemyBaseHp = 600;

        let units = [];
        let particles = [];
        let floatingTexts = [];
        let enemySpawnTimer = 0;

        const agesData = {
            1: {
                name: "1 - Taş & Mağara Çağı",
                xpReq: 150,
                units: [
                    { name: "Sopalı Neandertal", cost: 12, hp: 55, attack: 0.8, range: 25, speed: 1.2, color: "#d4a373", weapon: "club" },
                    { name: "Sapanlı Avcı", cost: 28, hp: 35, attack: 1.0, range: 130, speed: 1.0, color: "#588157", weapon: "sling" }
                ],
                enemies: [
                    { hp: 55, attack: 0.8, speed: -1.2, color: "#bc6c25", range: 25, weapon: "club" },
                    { hp: 35, attack: 1.0, speed: -1.0, color: "#7f4f24", range: 130, weapon: "sling" }
                ]
            },
            2: {
                name: "2 - Tunç & Bronz Çağı",
                xpReq: 350,
                units: [
                    { name: "Bronz Kılıçlı", cost: 45, hp: 110, attack: 1.8, range: 28, speed: 1.1, color: "#adb5bd", weapon: "sword" },
                    { name: "Kompozit Okçu", cost: 75, hp: 70, attack: 2.3, range: 145, speed: 0.9, color: "#3a86ff", weapon: "bow" }
                ],
                enemies: [
                    { hp: 110, attack: 1.8, speed: -1.1, color: "#6c757d", range: 28, weapon: "sword" },
                    { hp: 70, attack: 2.3, speed: -0.9, color: "#0077b6", range: 145, weapon: "bow" }
                ]
            },
            3: {
                name: "3 - Demir & Orta Çağ",
                xpReq: 750,
                units: [
                    { name: "Demir Şövalye", cost: 120, hp: 200, attack: 3.5, range: 30, speed: 1.0, color: "#e9c46a", weapon: "shield" },
                    { name: "Ağır Arbaletçi", cost: 170, hp: 120, attack: 4.2, range: 160, speed: 0.8, color: "#f4a261", weapon: "crossbow" }
                ],
                enemies: [
                    { hp: 200, attack: 3.5, speed: -1.0, color: "#d4a373", range: 30, weapon: "shield" },
                    { hp: 120, attack: 4.2, speed: -0.8, color: "#e76f51", range: 160, weapon: "crossbow" }
                ]
            },
            4: {
                name: "4 - Modern & Gelecek Çağı",
                xpReq: 1500,
                units: [
                    { name: "Siber Savaşçı", cost: 280, hp: 380, attack: 6.5, range: 35, speed: 1.3, color: "#00f5d4", weapon: "laser" },
                    { name: "Plazma Topçusu", cost: 420, hp: 230, attack: 8.5, range: 180, speed: 0.9, color: "#7209b7", weapon: "plasma" }
                ],
                enemies: [
                    { hp: 380, attack: 6.5, speed: -1.3, color: "#4cc9f0", range: 35, weapon: "laser" },
                    { hp: 230, attack: 8.5, speed: -0.9, color: "#3f37c9", range: 180, weapon: "plasma" }
                ]
            }
        };

        function updateUI() {
            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("exp").innerText = exp;
            document.getElementById("ageText").innerText = agesData[currentAge] ? agesData[currentAge].name : `${currentAge} - Sonsuzluk`;
            
            let curUnits = agesData[currentAge] ? agesData[currentAge].units : agesData[4].units;
            let html = "";
            for (let i = 0; i < curUnits.length; i++) {
                html += `<button class="hud-btn" onclick="spawnUnit(${i})">${curUnits[i].name}<br>(${curUnits[i].cost}G)</button>`;
            }
            document.getElementById("unitMenu").innerHTML = html;
        }

        function spawnUnit(index) {
            let activeUnits = agesData[currentAge] ? agesData[currentAge].units : agesData[4].units;
            let uData = activeUnits[index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                playSound('coin');
                updateUI();

                units.push({
                    x: 95,
                    y: 340,
                    speed: uData.speed,
                    team: 'player',
                    hp: uData.hp,
                    maxHp: uData.hp,
                    attack: uData.attack,
                    range: uData.range,
                    color: uData.color,
                    weapon: uData.weapon
                });
            }
        }

        function upgradeAge() {
            let req = agesData[currentAge] ? agesData[currentAge].xpReq : currentAge * 1000;
            if (exp >= req) {
                currentAge++;
                exp = 0;
                playSound('coin');
                alert(`Tebrikler Usta! Yeni çağa geçiş yaptın!`);
                updateUI();
            } else {
                alert(`Çağ atlamak için ${req} XP gerekiyor! (Mevcut: ${exp})`);
            }
        }

        function specialAttack() {
            if (gold >= 70) {
                gold -= 70;
                playSound('boom');
                updateUI();
                for (let u of units) {
                    if (u.team === 'enemy') u.hp -= 120;
                }
                enemyBaseHp -= 45;
                for (let i = 0; i < 50; i++) {
                    particles.push({
                        x: Math.random() * 600 + 100,
                        y: Math.random() * 300 + 50,
                        vx: (Math.random() - 0.5) * 14,
                        vy: (Math.random() - 0.5) * 14,
                        life: 35,
                        color: Math.random() > 0.5 ? "#ff0054" : "#00ffcc"
                    });
                }
            }
        }

        function repairBase() {
            if (gold >= 50 && playerBaseHp < 600) {
                gold -= 50;
                playerBaseHp = Math.min(600, playerBaseHp + 90);
                playSound('coin');
                updateUI();
            }
        }

        // Pasif Gelir (Hafif artırıldı)
        setInterval(() => {
            gold += 6;
            updateUI();
        }, 1000);

        updateUI();

        // Ana Oyun Döngüsü
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- ÜSLER VE ZEMİN ---
            ctx.fillStyle = currentAge >= 4 ? "#004d40" : "#2b170b";
            ctx.beginPath();
            ctx.arc(60, 310, 58, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#020101";
            ctx.beginPath();
            ctx.ellipse(60, 340, 24, 26, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = currentAge >= 4 ? "#311b92" : "#2b170b";
            ctx.beginPath();
            ctx.arc(740, 310, 58, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#020101";
            ctx.beginPath();
            ctx.ellipse(740, 340, 24, 26, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- CAN BARLARI ---
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(18, 120, 16, 230);
            ctx.fillStyle = "#06d6a0";
            let pBarH = (playerBaseHp / 600) * 230;
            ctx.fillRect(18, 120 + (230 - pBarH), 16, pBarH);

            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(766, 120, 16, 230);
            ctx.fillStyle = "#ef476f";
            let eBarH = (enemyBaseHp / 600) * 230;
            ctx.fillRect(766, 120 + (230 - eBarH), 16, eBarH);

            // --- DÜŞMAN ÜRETİMİ ---
            enemySpawnTimer++;
            let spawnInterval = Math.max(55, 110 - (currentAge * 8));
            if (enemySpawnTimer > spawnInterval && enemyBaseHp > 0) {
                enemySpawnTimer = 0;
                let ePool = agesData[currentAge] ? agesData[currentAge].enemies : agesData[4].enemies;
                let t = ePool[Math.floor(Math.random() * ePool.length)];
                
                let scaleMultiplier = 1 + (currentAge - 1) * 0.12;
                units.push({
                    x: 705,
                    y: 340,
                    speed: t.speed,
                    team: 'enemy',
                    hp: t.hp * scaleMultiplier,
                    maxHp: t.hp * scaleMultiplier,
                    attack: t.attack * scaleMultiplier,
                    range: t.range,
                    color: t.color,
                    weapon: t.weapon
                });
            }

            // --- BİRİM HAREKET & ÇARPIŞMA ---
            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (Math.random() < 0.3) playSound('hit');
                            if (target.hp <= 0) {
                                exp += 25 * currentAge;
                                gold += 12; // Düşman ölünce hafiften gold ödülü
                                floatingTexts.push({ x: target.x, y: target.y - 40, text: "+12G", life: 30, color: "#ffd700" });
                                playSound('coin');
                            }
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (Math.random() < 0.3) playSound('hit');
                        }
                    }
                }

                // Üslere Hasar
                if (u.team === 'player' && u.x >= 710) {
                    enemyBaseHp -= 0.7;
                    combat = true;
                } else if (u.team === 'enemy' && u.x <= 90) {
                    playerBaseHp -= 0.7;
                    combat = true;
                }

                if (!combat) {
                    u.x += u.speed;
                }

                // --- ULTRA GERÇEKÇİ SAVAŞÇI ÇİZİMİ (Gövde, Zırh, Silah ve Başlık) ---
                // Gövde
                ctx.fillStyle = u.color;
                ctx.fillRect(u.x - 7, u.y - 32, 14, 32);
                
                // Kafa ve Kask
                ctx.fillStyle = "#fffaed";
                ctx.beginPath();
                ctx.arc(u.x, u.y - 38, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = u.team === 'player' ? "#1d3557" : "#450920";
                ctx.fillRect(u.x - 7, u.y - 44, 14, 4); // Miğfer / Saç

                // Detaylı Silahlar
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (u.weapon === 'club' || u.weapon === 'sword') {
                    ctx.moveTo(u.team === 'player' ? u.x + 6 : u.x - 6, u.y - 20);
                    ctx.lineTo(u.team === 'player' ? u.x + 14 : u.x - 14, u.y - 26);
                } else if (u.weapon === 'bow' || u.weapon === 'sling' || u.weapon === 'crossbow') {
                    ctx.moveTo(u.team === 'player' ? u.x + 4 : u.x - 4, u.y - 28);
                    ctx.lineTo(u.team === 'player' ? u.x + 12 : u.x - 12, u.y - 16);
                } else { // Lazer / Plazma
                    ctx.fillStyle = "#00ffcc";
                    ctx.fillRect(u.team === 'player' ? u.x + 4 : u.x - 10, u.y - 24, 10, 4);
                }
                ctx.stroke();

                // Can Barı
                ctx.fillStyle = "#000";
                ctx.fillRect(u.x - 12, u.y - 52, 24, 4);
                ctx.fillStyle = u.team === 'player' ? "#00ffcc" : "#ff0054";
                ctx.fillRect(u.x - 12, u.y - 52, (u.hp / u.maxHp) * 24, 4);
            }

            units = units.filter(u => u.hp > 0);

            // Yüzen Altın Yazıları
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 0.8;
                ft.life--;
                ctx.fillStyle = ft.color;
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(ft.text, ft.x, ft.y);
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // Patlama Parçacıkları
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 5, 5);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Oyun Bitiş
            if (playerBaseHp <= 0) {
                alert("Üssün yıkıldı usta! Tekrar deneyelim.");
                location.reload();
            } else if (enemyBaseHp <= 0) {
                alert("Helal olsun! Düşman üssünü paramparça ettin, zafer senin!");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
