<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Legend Age of War - Bugfree Edition</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #030303;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2px;
        }
        
        .game-header {
            width: 100%;
            background: linear-gradient(135deg, #3d2311, #1a0f07);
            border: 2px solid #271408;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .hud-stats {
            background: linear-gradient(to bottom, #c29b68, #8c6239);
            border: 1px solid #140b04;
            color: #111;
            padding: 3px 5px;
            font-weight: bold;
            font-size: 8.5px;
            text-align: left;
            line-height: 1.15;
            border-radius: 3px;
        }
        .hud-menu {
            display: flex;
            gap: 3px;
            background: rgba(0,0,0,0.5);
            padding: 2px;
            border-radius: 4px;
            overflow-x: auto;
            max-width: 56%;
        }
        .hud-btn {
            background: linear-gradient(to bottom, #fefae0, #a3ac80);
            border: 1.5px solid #140b04;
            padding: 3px 5px;
            font-family: inherit;
            font-weight: bold;
            font-size: 8.5px;
            cursor: pointer;
            color: #111;
            border-radius: 3px;
            box-shadow: 0 2px 0 #2b180a;
            white-space: nowrap;
        }
        .hud-btn:active { transform: translateY(1px); box-shadow: none; }

        canvas {
            width: 100%;
            height: auto;
            max-height: 52vh;
            aspect-ratio: 2 / 1;
            background: linear-gradient(to bottom, #010408 0%, #0d1b2a 40%, #1b263b 50%, #2b170b 50%, #0d0402 100%);
            border: 2px solid #271408;
            display: block;
            border-radius: 4px;
            flex-shrink: 1;
        }

        .game-footer {
            width: 100%;
            background: linear-gradient(135deg, #3d2311, #1a0f07);
            border: 2px solid #271408;
            display: flex;
            justify-content: space-around;
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-bottom: env(safe-area-inset-bottom);
        }
        .footer-btn {
            background: linear-gradient(to bottom, #b7094c, #69022b);
            color: white;
            border: 1.5px solid #140b04;
            padding: 5px 6px;
            font-family: inherit;
            font-weight: bold;
            font-size: 8.5px;
            cursor: pointer;
            border-radius: 3px;
            box-shadow: 0 2px 0 #2b0011;
            flex: 1;
            margin: 0 2px;
            text-align: center;
        }
        .footer-btn:active { transform: translateY(1px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <div class="hud-stats">
                Gold: <span id="gold" style="color: #ffaa00;">350</span> | Exp: <span id="exp" style="color: #00ffaa;">0</span><br>
                Çağ: <span id="ageText" style="color: #ff3333;">1 - Mağara</span>
            </div>
            <div class="hud-menu" id="unitMenu"></div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="game-footer">
            <button class="footer-btn" onclick="specialAttack()">Atomik Bomba (70G)</button>
            <button class="footer-btn" onclick="repairBase()" style="background: linear-gradient(to bottom, #007200, #003600);">Üssü Onar (50G)</button>
            <button class="footer-btn" onclick="upgradeAge()" style="background: linear-gradient(to bottom, #ff9e00, #b26d00); color:#111;">ÇAĞ ATLA</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let t = audioCtx.currentTime;

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(1600, t + 0.12);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
                osc.start(t); osc.stop(t + 0.12);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, t);
                osc.frequency.linearRampToValueAtTime(40, t + 0.08);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                osc.start(t); osc.stop(t + 0.08);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, t);
                osc.frequency.exponentialRampToValueAtTime(15, t + 0.45);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
                osc.start(t); osc.stop(t + 0.45);
            }
        }

        let gold = 350;
        let exp = 0;
        let currentAge = 1;
        let levelRound = 1;
        let playerBaseHp = 600;
        let maxPlayerHp = 600;
        let enemyBaseHp = 600;
        let maxEnemyHp = 600;
        let isTransitioning = false;

        let units = [];
        let particles = [];
        let floatingTexts = [];
        let enemySpawnTimer = 0;

        const agesData = {
            1: { name: "1 - Mağara", xpReq: 150, units: [{ name: "Sopalı", cost: 12, hp: 55, attack: 0.8, range: 25, speed: 1.2, color: "#d4a373", weapon: "club" }, { name: "Sapanlı", cost: 28, hp: 35, attack: 1.0, range: 130, speed: 1.0, color: "#588157", weapon: "sling" }], enemies: [{ hp: 55, attack: 0.8, speed: -1.2, color: "#bc6c25", range: 25, weapon: "club" }, { hp: 35, attack: 1.0, speed: -1.0, color: "#7f4f24", range: 130, weapon: "sling" }] },
            2: { name: "2 - Tunç", xpReq: 350, units: [{ name: "Kılıçlı", cost: 45, hp: 110, attack: 1.8, range: 28, speed: 1.1, color: "#adb5bd", weapon: "sword" }, { name: "Okçu", cost: 75, hp: 70, attack: 2.3, range: 145, speed: 0.9, color: "#3a86ff", weapon: "bow" }], enemies: [{ hp: 110, attack: 1.8, speed: -1.1, color: "#6c757d", range: 28, weapon: "sword" }, { hp: 70, attack: 2.3, speed: -0.9, color: "#0077b6", range: 145, weapon: "bow" }] },
            3: { name: "3 - Demir", xpReq: 750, units: [{ name: "Şövalye", cost: 120, hp: 200, attack: 3.5, range: 30, speed: 1.0, color: "#e9c46a", weapon: "shield" }, { name: "Arbaletçi", cost: 170, hp: 120, attack: 4.2, range: 160, speed: 0.8, color: "#f4a261", weapon: "crossbow" }], enemies: [{ hp: 200, attack: 3.5, speed: -1.0, color: "#d4a373", range: 30, weapon: "shield" }, { hp: 120, attack: 4.2, speed: -0.8, color: "#e76f51", range: 160, weapon: "crossbow" }] },
            4: { name: "4 - Gelecek", xpReq: 1500, units: [{ name: "Siber", cost: 280, hp: 380, attack: 6.5, range: 35, speed: 1.3, color: "#00f5d4", weapon: "laser" }, { name: "Plazma", cost: 420, hp: 230, attack: 8.5, range: 180, speed: 0.9, color: "#7209b7", weapon: "plasma" }], enemies: [{ hp: 380, attack: 6.5, speed: -1.3, color: "#4cc9f0", range: 35, weapon: "laser" }, { hp: 230, attack: 8.5, speed: -0.9, color: "#3f37c9", range: 180, weapon: "plasma" }] }
        };

        function updateUI() {
            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("exp").innerText = exp;
            let ageName = agesData[currentAge] ? agesData[currentAge].name : `${currentAge}-Sonsuz`;
            document.getElementById("ageText").innerText = `${ageName} (Tur ${levelRound})`;
            
            let curUnits = agesData[currentAge] ? agesData[currentAge].units : agesData[4].units;
            let html = "";
            for (let i = 0; i < curUnits.length; i++) {
                html += `<button class="hud-btn" onclick="spawnUnit(${i})">${curUnits[i].name}<br>(${curUnits[i].cost}G)</button>`;
            }
            document.getElementById("unitMenu").innerHTML = html;
        }

        function spawnUnit(index) {
            let activeUnits = agesData[currentAge] ? agesData[currentAge].units : agesData[4].units;
            let uData = activeUnits[index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                playSound('coin');
                updateUI();
                units.push({ x: 95, y: 340, speed: uData.speed, team: 'player', hp: uData.hp, maxHp: uData.hp, attack: uData.attack, range: uData.range, color: uData.color, weapon: uData.weapon });
            }
        }

        function upgradeAge() {
            let req = agesData[currentAge] ? agesData[currentAge].xpReq : currentAge * 1000;
            if (exp >= req) {
                currentAge++;
                exp = 0;
                playSound('coin');
                alert(`Helal Usta! Çağ atladın, ordun güçlendi!`);
                updateUI();
            } else {
                alert(`Çağ atlamak için ${req} XP gerekiyor! (Mevcut: ${exp})`);
            }
        }

        function specialAttack() {
            if (gold >= 70) {
                gold -= 70;
                playSound('boom');
                updateUI();
                for (let u of units) { if (u.team === 'enemy') u.hp -= 120; }
                enemyBaseHp -= 45;
                for (let i = 0; i < 40; i++) {
                    particles.push({ x: Math.random() * 600 + 100, y: Math.random() * 300 + 50, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12, life: 30, color: Math.random() > 0.5 ? "#ff0054" : "#00ffcc" });
                }
            }
        }

        function repairBase() {
            if (gold >= 50 && playerBaseHp < maxPlayerHp) {
                gold -= 50;
                playerBaseHp = Math.min(maxPlayerHp, playerBaseHp + 90);
                playSound('coin');
                updateUI();
            }
        }

        setInterval(() => { gold += 6; updateUI(); }, 1000);
        updateUI();

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.fillRect(150, 30, 2, 2);
            ctx.fillRect(350, 60, 3, 3);
            ctx.fillRect(600, 40, 2, 2);

            ctx.strokeStyle = "#1a0f0a";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 340);
            ctx.lineTo(800, 340);
            ctx.stroke();

            ctx.fillStyle = currentAge >= 4 ? "#00695c" : "#3d2311";
            ctx.beginPath(); ctx.arc(60, 310, 58, 0, Math.PI, true); ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = "#1a0f07"; ctx.stroke();
            ctx.fillStyle = "#050302"; ctx.beginPath(); ctx.ellipse(60, 340, 22, 26, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = currentAge >= 4 ? "#4527a0" : "#3d2311";
            ctx.beginPath(); ctx.arc(740, 310, 58, 0, Math.PI, true); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#050302"; ctx.beginPath(); ctx.ellipse(740, 340, 22, 26, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#0a0a0a"; ctx.fillRect(18, 120, 16, 230);
            ctx.fillStyle = "#06d6a0"; let pBarH = (playerBaseHp / maxPlayerHp) * 230; ctx.fillRect(18, 120 + (230 - pBarH), 16, pBarH);

            ctx.fillStyle = "#0a0a0a"; ctx.fillRect(766, 120, 16, 230);
            ctx.fillStyle = "#ef476f"; let eBarH = (enemyBaseHp / maxEnemyHp) * 230; ctx.fillRect(766, 120 + (230 - eBarH), 16, eBarH);

            enemySpawnTimer++;
            let spawnInterval = Math.max(45, 105 - (currentAge * 6) - (levelRound * 3));
            if (enemySpawnTimer > spawnInterval && enemyBaseHp > 0 && !isTransitioning) {
                enemySpawnTimer = 0;
                let ePool = agesData[currentAge] ? agesData[currentAge].enemies : agesData[4].enemies;
                let t = ePool[Math.floor(Math.random() * ePool.length)];
                let diffMultiplier = 1 + (currentAge - 1) * 0.15 + (levelRound - 1) * 0.2;
                units.push({ x: 705, y: 340, speed: t.speed - (levelRound * 0.03), team: 'enemy', hp: t.hp * diffMultiplier, maxHp: t.hp * diffMultiplier, attack: t.attack * diffMultiplier, range: t.range, color: t.color, weapon: t.weapon });
            }

            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true; target.hp -= u.attack;
                            if (Math.random() < 0.3) playSound('hit');
                            if (target.hp <= 0) { exp += 25 * currentAge; gold += 12; floatingTexts.push({ x: target.x, y: target.y - 40, text: "+12G", life: 30, color: "#ffaa00" }); playSound('coin'); }
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true; target.hp -= u.attack;
                            if (Math.random() < 0.3) playSound('hit');
                        }
                    }
                }

                if (u.team === 'player' && u.x >= 710) { enemyBaseHp -= 0.8; combat = true; }
                else if (u.team === 'enemy' && u.x <= 90) { playerBaseHp -= 0.8; combat = true; }

                if (!combat) u.x += u.speed;

                ctx.fillStyle = u.color; ctx.fillRect(u.x - 7, u.y - 32, 14, 32);
                ctx.fillStyle = "#fffaed"; ctx.beginPath(); ctx.arc(u.x, u.y - 38, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = u.team === 'player' ? "#1d3557" : "#450920"; ctx.fillRect(u.x - 7, u.y - 45, 14, 4);

                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.beginPath();
                if (u.weapon === 'club' || u.weapon === 'sword') {
                    ctx.moveTo(u.team === 'player' ? u.x + 6 : u.x - 6, u.y - 20); ctx.lineTo(u.team === 'player' ? u.x + 15 : u.x - 15, u.y - 28);
                } else {
                    ctx.moveTo(u.team === 'player' ? u.x + 4 : u.x - 4, u.y - 28); ctx.lineTo(u.team === 'player' ? u.x + 13 : u.x - 13, u.y - 16);
                }
                ctx.stroke();

                ctx.fillStyle = "#000"; ctx.fillRect(u.x - 12, u.y - 53, 24, 4);
                ctx.fillStyle = u.team === 'player' ? "#00ffcc" : "#ff0054"; ctx.fillRect(u.x - 12, u.y - 53, (u.hp / u.maxHp) * 24, 4);
            }

            units = units.filter(u => u.hp > 0);

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i]; ft.y -= 0.8; ft.life--;
                ctx.fillStyle = ft.color; ctx.font = "bold 12px sans-serif"; ctx.fillText(ft.text, ft.x, ft.y);
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // GÜVENLİ TUR / BÖLÜM GEÇİŞİ (BUGFREE)
            if (enemyBaseHp <= 0 && !isTransitioning) {
                isTransitioning = true;
                levelRound++;
                maxEnemyHp = 600 + (levelRound * 150);
                enemyBaseHp = maxEnemyHp;
                gold += 200;
                units = []; // Savaş alanını temizle
                playSound('boom');
                alert(`Helal Usta! Düşman kalesini yıktın! Tur ${levelRound} başlıyor (+200 Altın kazandın)!`);
                setTimeout(() => { isTransitioning = false; }, 1000);
            }

            if (playerBaseHp <= 0) {
                alert("Üssün yıkıldı usta! Sağlık olsun, baştan başlıyoruz.");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
