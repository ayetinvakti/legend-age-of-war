<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Age of War</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        canvas {
            background-color: #222;
            border: 2px solid #555;
            display: block;
            margin: 15px auto;
            max-width: 100%;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .ui {
            font-size: 16px;
            margin-bottom: 5px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #ff9800;
            border: none;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
        button:active { background-color: #e68900; }
    </style>
</head>
<body>

    <h1>Legend Age of War</h1>
    <div class="ui">
        Altın: <span id="gold">100</span> | 
        Oyuncu Can: <span id="playerHp">100</span> | 
        Düşman Can: <span id="enemyHp">100</span>
    </div>
    
    <!-- Oyun Alanı -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <button onclick="spawnPlayerUnit()">Asker Bas (15 Altın)</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gold = 100;
        let playerBaseHp = 100;
        let enemyBaseHp = 100;
        let units = [];

        // Üsleri Çizme
        function drawBases() {
            // Oyuncu Üssü (Sol)
            ctx.fillStyle = "#2196F3";
            ctx.fillRect(20, 240, 60, 130);
            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.fillText("Üssün", 30, 230);

            // Düşman Üssü (Sağ)
            ctx.fillStyle = "#F44336";
            ctx.fillRect(720, 240, 60, 130);
            ctx.fillText("Düşman", 730, 230);
        }

        // Oyuncu Askeri Bas
        function spawnPlayerUnit() {
            if (gold >= 15) {
                gold -= 15;
                document.getElementById("gold").innerText = gold;
                
                units.push({
                    x: 90,
                    y: 330,
                    speed: 1.5,
                    type: 'player',
                    hp: 30,
                    attack: 0.5,
                    range: 25
                });
            }
        }

        // Düşman Otomatik Asker Üretir
        setInterval(() => {
            if (enemyBaseHp > 0) {
                units.push({
                    x: 710,
                    y: 330,
                    speed: -1.5,
                    type: 'enemy',
                    hp: 30,
                    attack: 0.5,
                    range: 25
                });
            }
        }, 4000); // Her 4 saniyede bir düşman gelir

        // Zamanla Altın Kazanma
        setInterval(() => {
            gold += 3;
            document.getElementById("gold").innerText = gold;
        }, 1000);

        // Ana Oyun Döngüsü
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zemin Çizgisi
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 370);
            ctx.lineTo(800, 370);
            ctx.stroke();

            drawBases();

            // Birimleri Hareket Ettirme ve Çarpışma Kontrolü
            for (let i = 0; i < units.length; i++) {
                let u = units[i];

                // Karşı tarafı bulma (Çarpışma mantığı)
                let combat = false;
                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.type !== target.type) {
                        // Eğer önünde düşman varsa dur ve vur
                        if (u.type === 'player' && target.x > u.x && target.x - u.x <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                        } else if (u.type === 'enemy' && target.x < u.x && u.x - target.x <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                        }
                    }
                }

                // Üslere varma kontrolü
                if (u.type === 'player' && u.x >= 700) {
                    enemyBaseHp -= 0.5;
                    document.getElementById("enemyHp").innerText = Math.max(0, Math.floor(enemyBaseHp));
                    combat = true;
                } else if (u.type === 'enemy' && u.x <= 80) {
                    playerBaseHp -= 0.5;
                    document.getElementById("playerHp").innerText = Math.max(0, Math.floor(playerBaseHp));
                    combat = true;
                }

                // Çatışma yoksa hareket et
                if (!combat) {
                    u.x += u.speed;
                }

                // Birimi Ekrana Çiz
                if (u.type === 'player') {
                    ctx.fillStyle = "#00bcd4";
                    ctx.fillRect(u.x, u.y, 20, 40);
                } else {
                    ctx.fillStyle = "#e91e63";
                    ctx.fillRect(u.x, u.y, 20, 40);
                }
            }

            // Ölen birimleri listeden temizle (Canı 0 ve altı olanlar)
            units = units.filter(u => u.hp > 0);

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
