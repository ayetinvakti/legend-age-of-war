<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Age of War - Infinite Masterpiece HD</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #020202;
            color: #ffffff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 5px;
            user-select: none;
        }
        
        /* Ultra HD Lüks Ahşap Panel (HUD) */
        .game-header {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: linear-gradient(135deg, #4a2e12, #271708);
            border: 4px solid #140b04;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.25), 0 8px 25px rgba(0,0,0,0.9);
        }
        .hud-stats {
            background: linear-gradient(to bottom, #d4a373, #99683b);
            border: 2px solid #140b04;
            color: #111;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 12px;
            text-align: left;
            line-height: 1.4;
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.5);
        }
        .hud-menu {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hud-btn {
            background: linear-gradient(to bottom, #fefae0, #b5bc90);
            border: 2px solid #140b04;
            padding: 6px 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #111;
            border-radius: 5px;
            transition: 0.1s;
            box-shadow: 0 4px 0 #3a220e;
        }
        .hud-btn:hover { background: #ffffff; transform: translateY(-1px); }
        .hud-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a220e; }

        /* Ultra HD Canvas Alanı */
        canvas {
            background: linear-gradient(to bottom, #0f2027 0%, #203a43 50%, #2c5364 50%, #1a1008 100%);
            border-left: 4px solid #140b04;
            border-right: 4px solid #140b04;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        }

        /* Ultra HD Alt Kontrol Paneli */
        .game-footer {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: linear-gradient(135deg, #4a2e12, #271708);
            border: 4px solid #140b04;
            border-top: none;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .footer-btn {
            background: linear-gradient(to bottom, #d90429, #7a0215);
            color: white;
            border: 2px solid #140b04;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 0 #3a0007;
            transition: 0.1s;
        }
        .footer-btn:hover { filter: brightness(1.25); }
        .footer-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a0007; }
    </style>
</head>
<body>

    <!-- Üst HUD -->
    <div class="game-header">
        <div class="hud-stats">
            Gold: <span id="gold" style="color: #ffd700;">300</span><br>
            Exp: <span id="exp" style="color: #00ffcc;">0</span><br>
            Seviye / Çağ: <span id="ageText" style="color: #ff4d4d;">1 (Mağara Başlangıcı)</span>
        </div>
        <div class="hud-menu" id="unitMenu"></div>
    </div>

    <!-- Oyun Alanı -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Alt Kontrol Paneli -->
    <div class="game-footer">
        <button class="footer-btn" onclick="specialAttack()">Atomik Bomba (80G)</button>
        <button class="footer-btn" onclick="repairBase()" style="background: linear-gradient(to bottom, #38b000, #134e13); box-shadow: 0 4px 0 #072605;">Üssü Güçlendir (60G)</button>
        <button class="footer-btn" onclick="upgradeAge()" style="background: linear-gradient(to bottom, #ffb703, #fb8500); color:#111; box-shadow: 0 4px 0 #7b3800;">SÜPER ÇAĞ ATLA</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- GELİŞMİŞ WEB AUDIO API SES MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let t = audioCtx.currentTime;

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(1600, t + 0.12);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
                osc.start(t); osc.stop(t + 0.12);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.linearRampToValueAtTime(50, t + 0.08);
                gain.gain.setValueAtTime(0.35, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                osc.start(t); osc.stop(t + 0.08);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 0.5);
                gain.gain.setValueAtTime(0.6, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            }
        }

        let gold = 300;
        let exp = 0;
        let currentAge = 1;
        let playerBaseHp = 600;
        let enemyBaseHp = 600;

        let units = [];
        let particles = [];
        let enemySpawnTimer = 0;

        // 1'den 1000'e ölçeklenebilir, sınırsız türetilebilir çağ mimarisi
        const agesData = {
            1: {
                name: "1 - Taş & Mağara Çağı",
                xpReq: 200,
                units: [
                    { name: "Sopalı Neandertal", cost: 15, hp: 60, attack: 0.7, range: 25, speed: 1.2, color: "#d4a373" },
                    { name: "Sapanlı Avcı", cost: 35, hp: 40, attack: 0.9, range: 125, speed: 1.0, color: "#588157" }
                ],
                enemies: [
                    { hp: 60, attack: 0.7, speed: -1.2, color: "#bc6c25", range: 25 },
                    { hp: 40, attack: 0.9, speed: -1.0, color: "#7f4f24", range: 125 }
                ]
            },
            2: {
                name: "2 - Tunç & Bronz Çağı",
                xpReq: 450,
                units: [
                    { name: "Bronz Kılıçlı", cost: 50, hp: 120, attack: 1.6, range: 28, speed: 1.1, color: "#adb5bd" },
                    { name: "Kompozit Okçu", cost: 90, hp: 75, attack: 2.1, range: 140, speed: 0.9, color: "#3a86ff" }
                ],
                enemies: [
                    { hp: 120, attack: 1.6, speed: -1.1, color: "#6c757d", range: 28 },
                    { hp: 75, attack: 2.1, speed: -0.9, color: "#0077b6", range: 140 }
                ]
            },
            3: {
                name: "3 - Demir & Orta Çağ",
                xpReq: 900,
                units: [
                    { name: "Demir Şövalye", cost: 140, hp: 220, attack: 3.2, range: 30, speed: 1.0, color: "#e9c46a" },
                    { name: "Ağır Arbaletçi", cost: 200, hp: 130, attack: 4.0, range: 150, speed: 0.8, color: "#f4a261" }
                ],
                enemies: [
                    { hp: 220, attack: 3.2, speed: -1.0, color: "#d4a373", range: 30 },
                    { hp: 130, attack: 4.0, speed: -0.8, color: "#e76f51", range: 150 }
                ]
            },
            4: {
                name: "4 - Modern & Gelecek Çağı",
                xpReq: 1800,
                units: [
                    { name: "Siber Savaşçı", cost: 350, hp: 420, attack: 6.5, range: 35, speed: 1.3, color: "#00f5d4" },
                    { name: "Plazma Topçusu", cost: 500, hp: 260, attack: 8.5, range: 170, speed: 0.9, color: "#7209b7" }
                ],
                enemies: [
                    { hp: 420, attack: 6.5, speed: -1.3, color: "#4cc9f0", range: 35 },
                    { hp: 260, attack: 8.5, speed: -0.9, color: "#3f37c9", range: 170 }
                ]
            }
        };

        function updateUI() {
            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("exp").innerText = exp;
            document.getElementById("ageText").innerText = agesData[currentAge] ? agesData[currentAge].name : `${currentAge} - Sonsuzluk Çağı`;
            
            let curUnits = agesData[currentAge] ? agesData[currentAge].units : agesData[4].units;
            let html = "";
            for (let i = 0; i < curUnits.length; i++) {
                html += `<button class="hud-btn" onclick="spawnUnit(${i})">${curUnits[i].name}<br>(${curUnits[i].cost}G)</button>`;
            }
            document.getElementById("unitMenu").innerHTML = html;
        }

        function spawnUnit(index) {
            let activeUnits = agesData[currentAge] ? agesData[currentAge].units : agesData[4].units;
            let uData = activeUnits[index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                playSound('coin');
                updateUI();

                units.push({
                    x: 95,
                    y: 340,
                    speed: uData.speed,
                    team: 'player',
                    hp: uData.hp,
                    maxHp: uData.hp,
                    attack: uData.attack,
                    range: uData.range,
                    color: uData.color
                });
            }
        }

        function upgradeAge() {
            let req = agesData[currentAge] ? agesData[currentAge].xpReq : currentAge * 1000;
            if (exp >= req) {
                currentAge++;
                exp = 0;
                playSound('coin');
                alert(`Tebrikler Usta! Seviye atladın, yeni çağ açıldı!`);
                updateUI();
            } else {
                alert(`Çağ atlamak için ${req} XP gerekiyor! (Mevcut: ${exp})`);
            }
        }

        function specialAttack() {
            if (gold >= 80) {
                gold -= 80;
                playSound('boom');
                updateUI();
                for (let u of units) {
                    if (u.team === 'enemy') u.hp -= 130;
                }
                enemyBaseHp -= 50;
                for (let i = 0; i < 60; i++) {
                    particles.push({
                        x: Math.random() * 600 + 100,
                        y: Math.random() * 300 + 50,
                        vx: (Math.random() - 0.5) * 14,
                        vy: (Math.random() - 0.5) * 14,
                        life: 40,
                        color: Math.random() > 0.5 ? "#ff0054" : "#00ffcc"
                    });
                }
            }
        }

        function repairBase() {
            if (gold >= 60 && playerBaseHp < 600) {
                gold -= 60;
                playerBaseHp = Math.min(600, playerBaseHp + 100);
                playSound('coin');
                updateUI();
            }
        }

        setInterval(() => {
            gold += 5;
            updateUI();
        }, 1000);

        updateUI();

        // Ultra HD Ana Oyun Döngüsü
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- ULTRA HD ÜSLER VE ZEMİN ---
            ctx.fillStyle = currentAge >= 4 ? "#004d40" : "#2b170b";
            ctx.beginPath();
            ctx.arc(60, 310, 58, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#020101";
            ctx.beginPath();
            ctx.ellipse(60, 340, 24, 26, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = currentAge >= 4 ? "#311b92" : "#2b170b";
            ctx.beginPath();
            ctx.arc(740, 310, 58, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#020101";
            ctx.beginPath();
            ctx.ellipse(740, 340, 24, 26, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- ULTRA HD DİKEY CAN BARLARI VE GLOW ---
            ctx.shadowBlur = 10;
            ctx.shadowColor = "rgba(0, 255, 204, 0.6)";

            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(18, 120, 16, 230);
            ctx.fillStyle = "#06d6a0";
            let pBarH = (playerBaseHp / 600) * 230;
            ctx.fillRect(18, 120 + (230 - pBarH), 16, pBarH);

            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(766, 120, 16, 230);
            ctx.fillStyle = "#ef476f";
            let eBarH = (enemyBaseHp / 600) * 230;
            ctx.fillRect(766, 120 + (230 - eBarH), 16, eBarH);

            ctx.shadowBlur = 0;

            // --- DÜŞMAN YAPAY ZEKA ÜRETİMİ ---
            enemySpawnTimer++;
            let spawnInterval = Math.max(50, 110 - (currentAge * 10));
            if (enemySpawnTimer > spawnInterval && enemyBaseHp > 0) {
                enemySpawnTimer = 0;
                let ePool = agesData[currentAge] ? agesData[currentAge].enemies : agesData[4].enemies;
                let t = ePool[Math.floor(Math.random() * ePool.length)];
                
                let scaleMultiplier = 1 + (currentAge - 1) * 0.15;
                units.push({
                    x: 705,
                    y: 340,
                    speed: t.speed,
                    team: 'enemy',
                    hp: t.hp * scaleMultiplier,
                    maxHp: t.hp * scaleMultiplier,
                    attack: t.attack * scaleMultiplier,
                    range: t.range,
                    color: t.color
                });
            }

            // --- BİRİM HAREKET, ÇARPIŞMA VE SESLER ---
            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (Math.random() < 0.25) playSound('hit');
                            if (target.hp <= 0) {
                                exp += 35 * currentAge;
                                playSound('coin');
                            }
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (Math.random() < 0.25) playSound('hit');
                        }
                    }
                }

                // Üslere Hasar
                if (u.team === 'player' && u.x >= 710) {
                    enemyBaseHp -= 0.8;
                    combat = true;
                } else if (u.team === 'enemy' && u.x <= 90) {
                    playerBaseHp -= 0.8;
                    combat = true;
                }

                if (!combat) {
                    u.x += u.speed;
                }

                // HD Karakter Çizimi
                ctx.fillStyle = u.color;
                ctx.fillRect(u.x - 6, u.y - 30, 12, 30);
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(u.x, u.y - 35, 5, 0, Math.PI * 2);
                ctx.fill();

                // Can Barı
                ctx.fillStyle = "#000";
                ctx.fillRect(u.x - 12, u.y - 45, 24, 4);
                ctx.fillStyle = u.team === 'player' ? "#00ffcc" : "#ff0054";
                ctx.fillRect(u.x - 12, u.y - 45, (u.hp / u.maxHp) * 24, 4);
            }

            units = units.filter(u => u.hp > 0);

            // Parçacık Patlama Efektleri
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 5, 5);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Oyun Bitiş Kontrolleri
            if (playerBaseHp <= 0) {
                alert("Üssün yıkıldı usta! Sağlık olsun, tekrar deneyelim.");
                location.reload();
            } else if (enemyBaseHp <= 0) {
                alert("Helal olsun! Düşman üssünü tarihe gömdün, zafer senin!");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
