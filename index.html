<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Age of War - Full Experience</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 5px;
        }
        
        /* Orijinal Ahşap Üst Panel (HUD) */
        .game-header {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: #8c5830;
            border: 4px solid #4a2e12;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }
        .hud-stats {
            background: #d4a373;
            border: 2px solid #4a2e12;
            color: #111;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 13px;
            text-align: left;
            line-height: 1.4;
        }
        .hud-menu {
            display: flex;
            gap: 4px;
            background: #a67c52;
            padding: 4px;
            border: 2px solid #4a2e12;
        }
        .hud-btn {
            background: #e9edc9;
            border: 2px solid #4a2e12;
            padding: 4px 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #222;
        }
        .hud-btn:hover { background: #fefae0; }
        .hud-btn:active { background: #ccd5ae; }

        /* Oyun Tuvali */
        canvas {
            background: linear-gradient(to bottom, #4f93e6 0%, #87bbfd 60%, #593d2b 60%, #301f14 100%);
            border-left: 4px solid #4a2e12;
            border-right: 4px solid #4a2e12;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }

        /* Alt Ahşap Kontrol Paneli */
        .game-footer {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
            background: #8c5830;
            border: 4px solid #4a2e12;
            border-top: none;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        .footer-btn {
            background: #bc6c25;
            color: white;
            border: 2px solid #281808;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
        }
        .footer-btn:hover { background: #dda15e; color: #111; }
        .footer-btn:active { background: #9b521b; }
    </style>
</head>
<body>

    <!-- Üst Ahşap HUD Alanı -->
    <div class="game-header">
        <div class="hud-stats">
            Gold: <span id="gold">150</span><br>
            Exp: <span id="exp">0</span>
        </div>
        <div class="hud-menu">
            <button class="hud-btn" onclick="spawnUnit(0)">Asker 1<br>(15G)</button>
            <button class="hud-btn" onclick="spawnUnit(1)">Asker 2<br>(30G)</button>
            <button class="hud-btn" onclick="upgradeAge()" style="background:#ffb703;">Çağ Atla<br>(200XP)</button>
        </div>
    </div>

    <!-- Oyun Ekranı (Canvas) -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Alt Kontrol Paneli -->
    <div class="game-footer">
        <button class="footer-btn" onclick="specialAttack()">Özel Bomba (50G)</button>
        <button class="footer-btn" onclick="repairBase()">Kareyi Onar (40G)</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gold = 150;
        let exp = 0;
        let currentAge = 1;
        let playerBaseHp = 500;
        let enemyBaseHp = 500;

        let units = [];
        let particles = [];
        let enemySpawnTimer = 0;

        const unitsConfig = {
            1: [
                { name: "Sopalı", cost: 15, hp: 45, attack: 0.6, range: 25, speed: 1.3, color: "#d4a373" },
                { name: "Sapanlı", cost: 30, hp: 30, attack: 0.8, range: 120, speed: 1.0, color: "#588157" }
            ]
        };

        function updateUI() {
            document.getElementById("gold").innerText = gold;
            document.getElementById("exp").innerText = exp;
        }

        function spawnUnit(index) {
            let uData = unitsConfig[currentAge][index];
            if (gold >= uData.cost) {
                gold -= uData.cost;
                updateUI();

                units.push({
                    x: 95,
                    y: 335,
                    speed: uData.speed,
                    team: 'player',
                    hp: uData.hp,
                    maxHp: uData.hp,
                    attack: uData.attack,
                    range: uData.range,
                    color: uData.color,
                    isRanged: index === 1
                });
            }
        }

        function specialAttack() {
            if (gold >= 50) {
                gold -= 50;
                updateUI();
                for (let u of units) {
                    if (u.team === 'enemy') u.hp -= 70;
                }
                enemyBaseHp -= 25;
                for (let i = 0; i < 35; i++) {
                    particles.push({
                        x: Math.random() * 500 + 150,
                        y: Math.random() * 250 + 100,
                        vx: (Math.random() - 0.5) * 9,
                        vy: (Math.random() - 0.5) * 9,
                        life: 25,
                        color: "#e76f51"
                    });
                }
            }
        }

        function repairBase() {
            if (gold >= 40 && playerBaseHp < 500) {
                gold -= 40;
                playerBaseHp = Math.min(500, playerBaseHp + 60);
                updateUI();
            }
        }

        function upgradeAge() {
            if (exp >= 200 && currentAge === 1) {
                currentAge = 2;
                exp -= 200;
                alert("Tebrikler! Tunç Çağı'na (Age 2) adım attınız!");
                updateUI();
            } else if (currentAge < 2) {
                alert("Çağ atlamak için 200 XP gerekiyor dostum!");
            }
        }

        setInterval(() => {
            gold += 3;
            updateUI();
        }, 1000);

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- 1. MAĞARALAR VE ZEMİN DETAYLARI ---
            // Oyuncu Mağarası (Sol)
            ctx.fillStyle = "#2c1d11";
            ctx.beginPath();
            ctx.arc(60, 310, 55, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#0a0705"; // Mağara girişi
            ctx.beginPath();
            ctx.ellipse(60, 335, 22, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // Düşman Mağarası (Sağ)
            ctx.fillStyle = "#2c1d11";
            ctx.beginPath();
            ctx.arc(740, 310, 55, 0, Math.PI, true);
            ctx.fill();
            ctx.fillStyle = "#0a0705";
            ctx.beginPath();
            ctx.ellipse(740, 335, 22, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- 2. DİKEY KIRMIZI ÜS CAN BARLARI ---
            // Sol Üs Can (Oyuncu)
            ctx.fillStyle = "#111";
            ctx.fillRect(18, 140, 12, 195);
            ctx.fillStyle = "#d90429";
            let pBarH = (playerBaseHp / 500) * 195;
            ctx.fillRect(18, 140 + (195 - pBarH), 12, pBarH);

            // Sağ Üs Can (Düşman)
            ctx.fillStyle = "#111";
            ctx.fillRect(770, 140, 12, 195);
            ctx.fillStyle = "#d90429";
            let eBarH = (enemyBaseHp / 500) * 195;
            ctx.fillRect(770, 140 + (195 - eBarH), 12, eBarH);

            // --- 3. DÜŞMAN ÜRETİMİ ---
            enemySpawnTimer++;
            if (enemySpawnTimer > 140 && enemyBaseHp > 0) {
                enemySpawnTimer = 0;
                units.push({
                    x: 705,
                    y: 335,
                    speed: -1.3,
                    team: 'enemy',
                    hp: 45,
                    maxHp: 45,
                    attack: 0.6,
                    range: 25,
                    color: "#9a3412",
                    isRanged: false
                });
            }

            // --- 4. BİRİM HAREKET VE ÇARPIŞMA ---
            for (let i = 0; i < units.length; i++) {
                let u = units[i];
                let combat = false;

                for (let j = 0; j < units.length; j++) {
                    let target = units[j];
                    if (u.team !== target.team) {
                        let distance = Math.abs(u.x - target.x);
                        if (u.team === 'player' && target.x > u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                            if (target.hp <= 0) exp += 15;
                        } else if (u.team === 'enemy' && target.x < u.x && distance <= u.range) {
                            combat = true;
                            target.hp -= u.attack;
                        }
                    }
                }

                // Üslere Hasar
                if (u.team === 'player' && u.x >= 710) {
                    enemyBaseHp -= 0.5;
                    combat = true;
                } else if (u.team === 'enemy' && u.x <= 90) {
                    playerBaseHp -= 0.5;
                    combat = true;
                }

                if (!combat) {
                    u.x += u.speed;
                }

                // Karakter Çizimi
                ctx.fillStyle = u.color;
                ctx.fillRect(u.x - 5, u.y - 24, 10, 24);
                ctx.fillStyle = "#ffdd99";
                ctx.beginPath();
                ctx.arc(u.x, u.y - 28, 4, 0, Math.PI * 2);
                ctx.fill();

                // Mini Can Barı
                ctx.fillStyle = "#000";
                ctx.fillRect(u.x - 9, u.y - 38, 18, 3);
                ctx.fillStyle = "#2b9348";
                ctx.fillRect(u.x - 9, u.y - 38, (u.hp / u.maxHp) * 18, 3);
            }

            units = units.filter(u => u.hp > 0);

            // Patlama Parçacıkları
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Oyun Bitiş Kontrolleri
            if (playerBaseHp <= 0) {
                alert("Üssün yıkıldı dostum! Maalesef kaybettin.");
                location.reload();
            } else if (enemyBaseHp <= 0) {
                alert("Helal olsun! Düşman üssünü paramparça ettin ve kazandın!");
                location.reload();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
